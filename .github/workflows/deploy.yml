name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
      - run: pnpm ci
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
