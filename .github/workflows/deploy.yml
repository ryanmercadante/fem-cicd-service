name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
      - run: pnpm ci
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
